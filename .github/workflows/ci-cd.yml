name: Build and Deploy IT-Tools
on:
  push:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.meta.outputs.IMAGE_LATEST }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to ACR
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.ALIYUN_ACR_REGISTRY }}
          username: ${{ secrets.ALIYUN_ACR_USERNAME }}
          password: ${{ secrets.ALIYUN_ACR_PASSWORD }}

      - name: Generate image tag
        id: meta
        run: |
          echo "IMAGE=${{ secrets.ALIYUN_ACR_REGISTRY }}/endiow/it-tools:${{ github.sha }}" >> $GITHUB_OUTPUT
          echo "IMAGE_LATEST=${{ secrets.ALIYUN_ACR_REGISTRY }}/endiow/it-tools:latest" >> $GITHUB_OUTPUT

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.meta.outputs.IMAGE }}
            ${{ steps.meta.outputs.IMAGE_LATEST }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to ECS via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.ECS_HOST }}
          username: ${{ secrets.ECS_SSH_USER }}
          key: ${{ secrets.ECS_SSH_PRIVATE_KEY }}
          script: |
            set -e
            ssh-keyscan github.com >> ~/.ssh/known_hosts
            cd /opt/it-tools
            git pull origin main
            export INNER_IMAGE=${{ secrets.ALIYUN_ACR_REGISTRY_INNER }}/endiow/it-tools:latest
            docker compose up -d
            docker compose ps
